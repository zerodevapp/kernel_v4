[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
via_ir = false # false is cheaper but need this to lower the contract size
optimizer = true
optimizer_runs = 200

evm_version = 'prague'
solc_version = '0.8.33'
cbor_metadata = false
bytecode_hash = "none"

isolate = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "releases" }]
ignored_warnings_from = ["test/", "tool/test/", "dependencies"]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[invariant]
runs = 1000
depth = 1000

[profile.ci.invariant]
runs = 10
depth = 10

[dependencies]
solady = "0.1.26"
eth-infinitism-account-abstraction = { version = "0.9.0", git = "https://github.com/eth-infinitism/account-abstraction.git", branch = "release-v09" }
"@openzeppelin-contracts" = "5.4.0"
a16z-halmos-cheatcodes = "6da4e692c357ba6d641a2e677a28298cac9f76ab"
forge-std = "1.11.0"


[profile.release-check]
test = "tool/test"

[lint]
exclude_lints = ["unwrapped-modifier-logic", "unchecked-call"]
ignore = ["test"]
lint_on_build = false
