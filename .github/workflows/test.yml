name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes --skip MockKernel
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  tools:
    name: Code Quality Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install bulloak
        run: |
          cargo install bulloak

      - name: Run Forge build
        run: |
          forge build --skip MockKernel

      - name: Run all checks
        run: |
          python3 tool/run.py --strict

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Full Test Coverage
        run: |
          echo "## Full Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          forge coverage --no-match-coverage "test/**" 2>&1 | tee coverage-full.txt
          cat coverage-full.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run BTT Test Coverage
        run: |
          echo "## BTT Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          forge coverage --match-path "test/btt/*.t.sol" --no-match-coverage "test/**" 2>&1 | tee coverage-btt.txt
          cat coverage-btt.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
