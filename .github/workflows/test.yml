name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          # --skip excludes test-only harnesses from EIP-170 size enforcement.
          # Harnesses inherit from production contracts and re-expose internals
          # via wrapper functions, which makes them larger than the originals;
          # they are never deployed in production, so size violations on them
          # are not real release blockers. The two specific halmos test files
          # below contain `KernelImmutableECDSAHarness` and `NonceHarness`,
          # which exceed EIP-170 because of harness-only accessor code added
          # in FV Round 1 Phase A (commits 9b2dc9e and 7ab9ed2).
          forge build --sizes \
            --skip MockKernel \
            --skip FallbackSignatureHalmos \
            --skip NonceOverflowHalmos
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
